name: Linux systemd VM physical proof (manual, pinned)

# This intentionally replaces the failed Docker-in-Docker systemd experiment.
# ubuntu-24.04 is a disposable GitHub-hosted VM, NOT ubuntu-slim and NOT a
# self-hosted machine. No execution from pull_request, push or merge.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_DISPOSABLE_LINUX_VM to authorize one temporary systemd unit on a GitHub-hosted Ubuntu VM'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-systemd-physical-proof
  cancel-in-progress: false

jobs:
  proof:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'RUN_DISPOSABLE_LINUX_VM' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable reviewed source, not mutable dispatch ref
        uses: actions/checkout@v4
        with:
          ref: d598341467fac86a2e5161a0613a17a0b91665d4
          persist-credentials: false
      - name: Verify pinned source identity and VM preflight (no mutation)
        shell: bash
        env:
          RUNNER_KIND: ${{ runner.environment }}
          PROOF_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$PROOF_CONFIRMATION" == RUN_DISPOSABLE_LINUX_VM ]]
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_OS" == Linux && "$RUNNER_KIND" == github-hosted ]]
          [[ "$GITHUB_REPOSITORY" == 'WasanthaK/cline-orchestrator' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && -d "$RUNNER_TEMP" ]]
          [[ ! -e /.dockerenv ]]
          [[ "$(cat /proc/1/comm)" == systemd && -d /run/systemd/system ]]
          sudo -n true
          systemctl --version | head -1
          [[ "$(git rev-parse HEAD)" == d598341467fac86a2e5161a0613a17a0b91665d4 ]]
          echo "Reviewed candidate: $(git rev-parse HEAD)"
          echo 'Disposable GitHub-hosted systemd VM preflight passed'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual pinned npm consumer package
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          sha256sum "$RUNNER_TEMP/cline-orchestrator-0.1.0.tgz"
          mkdir -p "$RUNNER_TEMP/orch-vm-consumer"
          npm install --global --prefix "$RUNNER_TEMP/orch-vm-consumer" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/cline-orchestrator-0.1.0.tgz"
          test -f "$RUNNER_TEMP/orch-vm-consumer/lib/node_modules/cline-orchestrator/dist/index.js"
      - name: Prove start, application health, stop and exact unit removal
        shell: bash
        env:
          RUNNER_KIND: ${{ runner.environment }}
          PROOF_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          # Repeat all authority and isolation checks immediately before
          # the first systemd mutation. Only the unique unit below is owned.
          [[ "$PROOF_CONFIRMATION" == RUN_DISPOSABLE_LINUX_VM ]]
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_OS" == Linux && "$RUNNER_KIND" == github-hosted ]]
          [[ "$GITHUB_REPOSITORY" == 'WasanthaK/cline-orchestrator' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && -d "$RUNNER_TEMP" ]]
          [[ ! -e /.dockerenv && "$(cat /proc/1/comm)" == systemd && -d /run/systemd/system ]]
          sudo -n true
          service="cline-orch-vm-proof-$GITHUB_RUN_ID"
          unit="/run/systemd/system/$service.service"
          workspace="$RUNNER_TEMP/orch-vm-workspace"
          home="$RUNNER_TEMP/orch-vm-home"
          owned="$RUNNER_TEMP/orch-vm-owned-sentinel"
          node="$(command -v node)"
          entry="$RUNNER_TEMP/orch-vm-consumer/lib/node_modules/cline-orchestrator/dist/index.js"
          port=43717
          [[ "$node" == /* && "$entry" == /* && "$workspace" == /* && "$home" == /* ]]
          [[ "$node $entry $workspace $home" != *$'\n'* && "$node $entry $workspace $home" != *$'\r'* ]]
          [[ "$node $entry $workspace $home" != *' '* ]]
          [[ -f "$entry" ]]
          if sudo test -e "$unit" || sudo systemctl list-unit-files --no-legend "$service.service" 2>/dev/null | grep -q "$service"; then
            echo 'Refusing: unit name already exists'
            exit 64
          fi
          if curl --noproxy '*' -fsS --max-time 2 "http://127.0.0.1:$port/health" >/dev/null 2>&1; then
            echo 'Refusing: test port already in use'
            exit 64
          fi
          mkdir -p "$workspace" "$home"
          printf 'operator-owned sentinel; never delete\n' > "$owned"
          expected="$(sha256sum "$owned" | cut -d' ' -f1)"
          registered=no
          cleanup() {
            result=$?
            trap - EXIT
            if [[ "$registered" == yes ]]; then
              if [[ "$result" -ne 0 ]]; then
                sudo systemctl status "$service.service" --no-pager --full || true
                sudo journalctl -u "$service.service" --no-pager -n 50 || true
              fi
              sudo systemctl stop "$service.service" >/dev/null 2>&1 || true
              sudo rm -f -- "$unit" || result=1
              sudo systemctl daemon-reload >/dev/null 2>&1 || result=1
              if sudo test -e "$unit"; then echo 'FAIL: owned unit file persists'; result=1; fi
              if sudo systemctl is-active --quiet "$service.service"; then
                echo 'FAIL: test service still active'
                result=1
              fi
            fi
            if [[ -f "$owned" && "$(sha256sum "$owned" | cut -d' ' -f1)" == "$expected" ]]; then
              echo 'Operator-owned sentinel preserved'
            else
              echo 'FAIL: operator-owned sentinel was modified'
              result=1
            fi
            exit "$result"
          }
          # Set cleanup before creating the unit, so partial writes fail safely.
          trap cleanup EXIT
          registered=yes
          cat <<EOF | sudo tee "$unit" >/dev/null
          [Unit]
          Description=Disposable Cline Orchestrator VM proof $GITHUB_RUN_ID
          [Service]
          Type=simple
          User=$(id -un)
          WorkingDirectory=$workspace
          ExecStart=$node $entry daemon $workspace
          Environment=HOME=$home
          Environment=ORCH_DAEMON_HOST=127.0.0.1
          Environment=ORCH_DAEMON_PORT=$port
          Environment=ORCH_AUTO_APPROVE_COMMANDS=false
          Environment=ORCH_AUTO_APPROVE_EDITS=false
          Restart=no
          KillMode=control-group
          TimeoutStopSec=15s
          NoNewPrivileges=true
          PrivateTmp=true
          EOF
          sudo systemd-analyze verify "$unit"
          sudo systemctl daemon-reload
          sudo systemctl start "$service.service"
          ready=no
          for i in $(seq 1 20); do
            if sudo systemctl is-active --quiet "$service.service" &&
              curl --noproxy '*' -fsS --max-time 2 "http://127.0.0.1:$port/health" |
              node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const x=JSON.parse(s);process.exit(x.status==="running"&&x.activeTaskId==null?0:1)})'; then
              ready=yes
              break
            fi
            sleep 1
          done
          [[ "$ready" == yes ]] || { echo 'FAIL: systemd active state and application health not established'; exit 1; }
          echo 'PASS: service RUNNING with independently checked localhost application health'
          # The service must not listen on public or IPv6 wildcard interfaces.
          listeners="$(ss -ltnH "( sport = :$port )")"
          [[ "$listeners" == *"127.0.0.1:$port"* ]]
          [[ "$listeners" != *"0.0.0.0:$port"* && "$listeners" != *"[::]:$port"* ]]
          sudo systemctl stop "$service.service"
          [[ "$(sudo systemctl is-active "$service.service" || true)" == inactive ]]
          if curl --noproxy '*' -fsS --max-time 2 "http://127.0.0.1:$port/health" >/dev/null 2>&1; then
            echo 'FAIL: service still listening after stop'
            exit 1
          fi
          echo 'PASS: service stopped and localhost port released'
          # Cleanup trap owns only this exact temporary unit and checks removal.
          echo 'PASS: disposable systemd VM lifecycle reached cleanup'
